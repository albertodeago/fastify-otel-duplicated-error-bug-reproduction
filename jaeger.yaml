service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [jaeger_storage_exporter]
  telemetry:
    traces:
      level: none
    metrics:
      level: none
    logs:
      level: warn

extensions:
  jaeger_storage:
    backends:
      local:
        memory:
          max_traces: 1000
  jaeger_query:
    storage:
      traces: local
    http:
      endpoint: 0.0.0.0:16686

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  jaeger_storage_exporter:
    trace_storage: local
